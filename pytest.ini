[pytest]
# Pytest configuration for emsim

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    slow: marks tests as slow (validation tests, typically > 30s)
    benchmark: marks tests as performance benchmarks
    integration: marks tests as integration tests
    validation: marks tests as physical validation tests

# Output options
addopts =
    --strict-markers
    --tb=short
    -ra

# Coverage options (when using --cov)
[coverage:run]
source = emsim
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
