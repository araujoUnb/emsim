[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emsim"
version = "0.1.0"
description = "3D FDTD Electromagnetic Simulator with TensorFlow"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = ["tensorflow[and-cuda]>=2.15"]

[tool.setuptools.packages.find]
include = ["emsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
